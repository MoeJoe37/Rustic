name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and tools
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build API documentation
        run: cargo doc --locked --workspace --no-deps

  test:
    # Native runners: every desktop OS on both x64 and ARM64 hardware.
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-2022
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS ARM64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup when the runner image lacks it
        # Pinned rustup-init release; each binary is checked against the
        # SHA-256 published at static.rust-lang.org/rustup/archive/<version>/
        # before it runs. Update version and hashes together.
        env:
          RUSTUP_INIT_VERSION: "1.29.3"
        run: |
          if command -v rustup >/dev/null; then exit 0; fi
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-ARM64) host=aarch64-pc-windows-msvc; exe=.exe; sha=407e0d72f81d26a01f9d032b8317908cbb2917ba22765474b682b41390792ad9 ;;
            Windows-X64) host=x86_64-pc-windows-msvc; exe=.exe; sha=38027d51d69a5d05493627a0634dbea52d6cd793c8f072d2373d3f4163eec7db ;;
            Linux-X64) host=x86_64-unknown-linux-gnu; exe=; sha=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 ;;
            Linux-ARM64) host=aarch64-unknown-linux-gnu; exe=; sha=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 ;;
            macOS-ARM64) host=aarch64-apple-darwin; exe=; sha=63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f ;;
            macOS-X64) host=x86_64-apple-darwin; exe=; sha=bc107f1fb0228de7fa32413c89c1b305cea9cd256e94b01150cd054128145429 ;;
            *) echo "No pinned rustup-init for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          installer="rustup-init$exe"
          curl --proto '=https' --tlsv1.2 -sSfLo "$installer" "https://static.rust-lang.org/rustup/archive/$RUSTUP_INIT_VERSION/$host/$installer"
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$installer" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$installer" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "rustup-init checksum mismatch: expected $sha, got $actual" >&2
            exit 1
          fi
          chmod +x "$installer"
          "./$installer" -y --profile minimal --default-toolchain none
          rm "$installer"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Report host target
        run: rustc -vV | grep '^host:'
      - name: Install bubblewrap for the default Linux renderer sandbox
        # ADR 0058: renderers run under bwrap with a seccomp allowlist. Ubuntu
        # 24.04 may restrict unprivileged user namespaces through AppArmor;
        # the sysctl is absent on images without that restriction.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Show sandbox denials (ADR 0063)
        if: failure() && runner.os == 'macOS'
        run: |
          sudo log show --last 30m --style compact \
            --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny("' \
            | grep -i rustic | sort | uniq -c | sort -rn | head -150 || true
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i rustic | head -3 \
            | while read -r report; do head -80 ~/Library/Logs/DiagnosticReports/"$report"; done || true
      - name: Test documentation examples
        run: cargo test --locked --workspace --doc
      - name: CLI smoke test
        run: cargo run --locked -p rustic-cli -- info
      - name: Run the pinned Window WPT selection
        if: runner.os == 'Linux'
        run: python3 tools/run_wpt_web_tests.py --rustic target/debug/rustic
      - name: Record native ARM64 JavaScript benchmarks
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$(uname -m)" = aarch64
          cargo build --locked --release -p rustic-js --example js_bench
          {
            echo '### JS-09 native Linux ARM64'
            echo '```text'
            git rev-parse HEAD
            uname -sr
            rustc -vV
            lscpu
            target/release/examples/js_bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  emulated:
    # Architectures without hosted runners run the whole test suite under QEMU
    # user-mode emulation (32-bit x86 runs natively). Together they cover
    # 32-bit pointers, big-endian byte order and a non-x86/ARM instruction set.
    name: Emulated test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # The whole suite under QEMU passed 40 minutes in November 2026 (armv7
    # and s390x were cut off mid-run, not failing); riscv64 needs about as
    # long.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            sysroot: /usr/arm-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-binfmt
          - target: i686-unknown-linux-gnu
            linker: gcc
            packages: gcc-multilib
          - target: riscv64gc-unknown-linux-gnu
            linker: riscv64-linux-gnu-gcc
            sysroot: /usr/riscv64-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user-binfmt
          - target: s390x-unknown-linux-gnu
            linker: s390x-linux-gnu-gcc
            sysroot: /usr/s390x-linux-gnu
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user-binfmt
    env:
      TEST_TARGET: ${{ matrix.target }}
      TARGET_LINKER: ${{ matrix.linker }}
      # binfmt-launched QEMU finds the target's dynamic loader and libraries
      # here, so CLI subprocess tests can execute target binaries directly.
      QEMU_LD_PREFIX: ${{ matrix.sysroot }}
      # QEMU user mode occasionally segfaults internally when many guest
      # threads run at once (seen about 1 in 12 runs of the fuzz harness on
      # s390x). Serial tests cost little here because the slow tests sleep.
      # TD-22 tracks this.
      RUST_TEST_THREADS: "1"
      # The seccomp allowlist has tables for x86-64 and aarch64 only, and
      # bubblewrap would run the host's emulator: renderers here opt out of
      # the sandbox explicitly (ADR 0058).
      RUSTIC_SANDBOX: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross linker and emulator
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update -q
          # Word splitting is intended: PACKAGES is a fixed matrix list.
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
      - name: Install pinned Rust and target standard library
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$TEST_TARGET"
      - name: Configure target linker
        run: |
          upper=$(echo "$TEST_TARGET" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${upper}_LINKER=$TARGET_LINKER" >> "$GITHUB_ENV"
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets --target "$TEST_TARGET"
      - name: CLI smoke test
        run: cargo run --locked -p rustic-cli --target "$TEST_TARGET" -- info

  cross:
    # Compile every crate, including tests and tools, for further CPU/OS
    # families that browsers run on. This catches portability errors early;
    # it does not link or execute on the target. ring (TLS, M6) compiles C
    # and assembly, so each target names a C cross compiler; where no
    # packaged one exists (`ring: skip`) the crates that use ring are left
    # out and recorded in TD-12.
    name: Cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            cc: arm-linux-gnueabihf-gcc
          - target: aarch64-unknown-linux-musl
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
          - target: aarch64-pc-windows-gnullvm
            ring: skip
          - target: i686-pc-windows-msvc
            os: windows-2022
          - target: powerpc64le-unknown-linux-gnu
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            cc: powerpc64le-linux-gnu-gcc
          - target: loongarch64-unknown-linux-gnu
            ring: skip
          - target: x86_64-unknown-freebsd
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            cc: musl-gcc
    env:
      CHECK_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target standard library
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$CHECK_TARGET"
      - name: Install the C cross compiler
        if: matrix.packages
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGET_C_COMPILER: ${{ matrix.cc }}
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
          echo "TARGET_CC=$TARGET_C_COMPILER" >> "$GITHUB_ENV"
      - name: Check every crate and test
        if: matrix.ring != 'skip'
        run: cargo check --locked --workspace --all-targets --target "$CHECK_TARGET"
      - name: Check every crate and test except those using ring (TD-12)
        if: matrix.ring == 'skip'
        run: >-
          cargo check --locked --workspace --all-targets --target "$CHECK_TARGET"
          --exclude rustic-net --exclude rustic-engine --exclude rustic-bindings
          --exclude rustic-cli --exclude rustic-fuzz

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Replay seeds and run fixed-seed mutations
        # Fixed seed and iteration count keep this required gate deterministic;
        # the scheduled Fuzz workflow explores fresh seeds.
        run: cargo run --locked --release -p rustic-fuzz -- run --all --seed 1 --iterations 20000 --timeout-ms 10000 --artifacts fuzz-artifacts
      - name: Retain reproducers
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproducers
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30

  compatibility:
    name: Compatibility (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compatibility toolchain
        env:
          CHECK_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$CHECK_TOOLCHAIN" --profile minimal
      - name: Free disk space for the full test build
        # The 1.85.0 build of every test binary filled the runner's disk
        # (2026-11-22); drop preinstalled SDKs this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install bubblewrap for the default Linux renderer sandbox
        # ADR 0058: renderers run under bwrap with a seccomp allowlist. Ubuntu
        # 24.04 may restrict unprivileged user namespaces through AppArmor;
        # the sysctl is absent on images without that restriction.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test compiler compatibility
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo test --locked --workspace --all-targets

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source and documentation consistency
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/progress.py --write
          python3 tools/progress.py --check
          python3 tools/check_repository.py
          cat docs/progress/summary.md >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-24.04
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
          - target: x86_64-linux-android
            os: ubuntu-24.04
          - target: i686-linux-android
            os: ubuntu-24.04
          - target: aarch64-apple-ios
            os: macos-15
            sdk: iphoneos
          - target: aarch64-apple-ios-sim
            os: macos-15
            sdk: iphonesimulator
          - target: x86_64-apple-ios
            os: macos-15
            sdk: iphonesimulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and mobile standard library
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$CHECK_TARGET"
      - name: Use the Android NDK's compilers for C dependencies
        if: runner.os == 'Linux'
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          echo "Android NDK: $ndk"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "$CHECK_TARGET" in
            armv7-linux-androideabi) clang=armv7a-linux-androideabi24-clang ;;
            *) clang="${CHECK_TARGET}24-clang" ;;
          esac
          if [ ! -x "$bin/$clang" ]; then
            ls "$bin" | grep -- -clang | head -n 20
            exit 1
          fi
          echo "TARGET_CC=$bin/$clang" >> "$GITHUB_ENV"
          echo "TARGET_AR=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Select iOS SDK
        if: runner.os == 'macOS'
        env:
          IOS_SDK: ${{ matrix.sdk }}
        run: echo "SDKROOT=$(xcrun --sdk "$IOS_SDK" --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cross-check shared engine libraries
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: cargo check --locked --workspace --lib --target "$CHECK_TARGET"

  android-emulator:
    name: Android isolated renderer (emulator, x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and the Android standard library
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" x86_64-linux-android
      - name: Build the native library with the Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export TARGET_CC="$bin/x86_64-linux-android28-clang"
          export TARGET_AR="$bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TARGET_CC"
          cargo build --locked --release -p rustic-android --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/librustic_android.so android/app/src/main/jniLibs/x86_64/
      - name: Install Gradle 8.11.1 (checksum pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - name: Build the app and its tests
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Start an emulator (API 34, x86-64, KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools="$sdk/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" --install "emulator" "platform-tools" "system-images;android-34;default;x86_64" > /dev/null
          echo no | "$tools/avdmanager" create avd -n rustic -k "system-images;android-34;default;x86_64" --force
          nohup "$sdk/emulator/emulator" -avd rustic -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$sdk/platform-tools/adb" wait-for-device
          for _ in $(seq 1 120); do
            if [ "$("$sdk/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              break
            fi
            sleep 5
          done
          "$sdk/platform-tools/adb" shell getprop sys.boot_completed
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Run the isolation tests on the emulator
        working-directory: android
        run: gradle --no-daemon connectedDebugAndroidTest
      - name: Show test reports and the device log on failure
        if: failure()
        run: |
          find android/app/build -path '*androidTest-results*' -name '*.xml' -exec cat {} + || true
          adb logcat -d | grep -iE 'rustic|AndroidRuntime|DEBUG|isolated' | tail -n 300 || true
          tail -n 50 "$RUNNER_TEMP/emulator.log" || true

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, test, emulated, cross, fuzz, compatibility, repository, mobile, android-emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EMULATED_RESULT: ${{ needs.emulated.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.android-emulator.result }}
        run: |
          for result in "$QUALITY_RESULT" "$TEST_RESULT" "$EMULATED_RESULT" "$CROSS_RESULT" "$FUZZ_RESULT" "$COMPATIBILITY_RESULT" "$REPOSITORY_RESULT" "$MOBILE_RESULT" "$ANDROID_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done

  progress:
    name: Publish progress
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Render validated source progress
        run: |
          python3 tools/progress.py --write
          python3 tools/progress.py --check
      - name: Publish changed outputs and validate the generated commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRESS_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/publish_progress.sh
