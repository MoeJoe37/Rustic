name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.99.1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and tools
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build API documentation
        run: cargo doc --locked --workspace --no-deps

  test:
    # Native runners: every desktop OS on both x64 and ARM64 hardware.
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-2022
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS ARM64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup when the runner image lacks it
        # Pinned rustup-init release; each binary is checked against the
        # SHA-256 published at static.rust-lang.org/rustup/archive/<version>/
        # before it runs. Update version and hashes together.
        env:
          RUSTUP_INIT_VERSION: "1.29.3"
        run: |
          if command -v rustup >/dev/null; then exit 0; fi
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-ARM64) host=aarch64-pc-windows-msvc; exe=.exe; sha=407e0d72f81d26a01f9d032b8317908cbb2917ba22765474b682b41390792ad9 ;;
            Windows-X64) host=x86_64-pc-windows-msvc; exe=.exe; sha=38027d51d69a5d05493627a0634dbea52d6cd793c8f072d2373d3f4163eec7db ;;
            Linux-X64) host=x86_64-unknown-linux-gnu; exe=; sha=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 ;;
            Linux-ARM64) host=aarch64-unknown-linux-gnu; exe=; sha=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 ;;
            macOS-ARM64) host=aarch64-apple-darwin; exe=; sha=63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f ;;
            macOS-X64) host=x86_64-apple-darwin; exe=; sha=bc107f1fb0228de7fa32413c89c1b305cea9cd256e94b01150cd054128145429 ;;
            *) echo "No pinned rustup-init for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          installer="rustup-init$exe"
          curl --proto '=https' --tlsv1.2 -sSfLo "$installer" "https://static.rust-lang.org/rustup/archive/$RUSTUP_INIT_VERSION/$host/$installer"
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$installer" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$installer" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "rustup-init checksum mismatch: expected $sha, got $actual" >&2
            exit 1
          fi
          chmod +x "$installer"
          "./$installer" -y --profile minimal --default-toolchain none
          rm "$installer"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Report host target
        run: rustc -vV | grep '^host:'
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets
      - name: Test documentation examples
        run: cargo test --locked --workspace --doc
      - name: CLI smoke test
        run: cargo run --locked -p rustic-cli -- info
      - name: Run the pinned Window WPT selection
        if: runner.os == 'Linux'
        run: python3 tools/run_wpt_web_tests.py --rustic target/debug/rustic
      - name: Record native ARM64 JavaScript benchmarks
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$(uname -m)" = aarch64
          cargo build --locked --release -p rustic-js --example js_bench
          {
            echo '### JS-09 native Linux ARM64'
            echo '```text'
            git rev-parse HEAD
            uname -sr
            rustc -vV
            lscpu
            target/release/examples/js_bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  emulated:
    # Architectures without hosted runners run the whole test suite under QEMU
    # user-mode emulation (32-bit x86 runs natively). Together they cover
    # 32-bit pointers, big-endian byte order and a non-x86/ARM instruction set.
    name: Emulated test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            sysroot: /usr/arm-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-binfmt
          - target: i686-unknown-linux-gnu
            linker: gcc
            packages: gcc-multilib
          - target: riscv64gc-unknown-linux-gnu
            linker: riscv64-linux-gnu-gcc
            sysroot: /usr/riscv64-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user-binfmt
          - target: s390x-unknown-linux-gnu
            linker: s390x-linux-gnu-gcc
            sysroot: /usr/s390x-linux-gnu
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user-binfmt
    env:
      TEST_TARGET: ${{ matrix.target }}
      TARGET_LINKER: ${{ matrix.linker }}
      # binfmt-launched QEMU finds the target's dynamic loader and libraries
      # here, so CLI subprocess tests can execute target binaries directly.
      QEMU_LD_PREFIX: ${{ matrix.sysroot }}
      # QEMU user mode occasionally segfaults internally when many guest
      # threads run at once (seen about 1 in 12 runs of the fuzz harness on
      # s390x). Serial tests cost little here because the slow tests sleep.
      # TD-22 tracks this.
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross linker and emulator
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update -q
          # Word splitting is intended: PACKAGES is a fixed matrix list.
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
      - name: Install pinned Rust and target standard library
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$TEST_TARGET"
      - name: Configure target linker
        run: |
          upper=$(echo "$TEST_TARGET" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${upper}_LINKER=$TARGET_LINKER" >> "$GITHUB_ENV"
      - name: Test all targets
        run: cargo test --locked --workspace --all-targets --target "$TEST_TARGET"
      - name: CLI smoke test
        run: cargo run --locked -p rustic-cli --target "$TEST_TARGET" -- info

  cross:
    # Compile every crate, including tests and tools, for further CPU/OS
    # families that browsers run on. This catches portability errors early;
    # it does not link or execute on the target.
    name: Cross-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-gnueabihf
          - aarch64-unknown-linux-musl
          - aarch64-pc-windows-gnullvm
          - i686-pc-windows-msvc
          - powerpc64le-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          - x86_64-unknown-freebsd
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target standard library
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$CHECK_TARGET"
      - name: Check every crate and test
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: cargo check --locked --workspace --all-targets --target "$CHECK_TARGET"

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Replay seeds and run fixed-seed mutations
        # Fixed seed and iteration count keep this required gate deterministic;
        # the scheduled Fuzz workflow explores fresh seeds.
        run: cargo run --locked --release -p rustic-fuzz -- run --all --seed 1 --iterations 20000 --timeout-ms 10000 --artifacts fuzz-artifacts
      - name: Retain reproducers
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproducers
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30

  compatibility:
    name: Compatibility (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compatibility toolchain
        env:
          CHECK_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$CHECK_TOOLCHAIN" --profile minimal
      - name: Test compiler compatibility
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo test --locked --workspace --all-targets

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source and documentation consistency
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/progress.py --write
          python3 tools/progress.py --check
          python3 tools/check_repository.py
          cat docs/progress/summary.md >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-24.04
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
          - target: x86_64-linux-android
            os: ubuntu-24.04
          - target: i686-linux-android
            os: ubuntu-24.04
          - target: aarch64-apple-ios
            os: macos-15
            sdk: iphoneos
          - target: aarch64-apple-ios-sim
            os: macos-15
            sdk: iphonesimulator
          - target: x86_64-apple-ios
            os: macos-15
            sdk: iphonesimulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and mobile standard library
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" "$CHECK_TARGET"
      - name: Select iOS SDK
        if: runner.os == 'macOS'
        env:
          IOS_SDK: ${{ matrix.sdk }}
        run: echo "SDKROOT=$(xcrun --sdk "$IOS_SDK" --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cross-check shared engine libraries
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: cargo check --locked --workspace --lib --target "$CHECK_TARGET"

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, test, emulated, cross, fuzz, compatibility, repository, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EMULATED_RESULT: ${{ needs.emulated.result }}
          CROSS_RESULT: ${{ needs.cross.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          for result in "$QUALITY_RESULT" "$TEST_RESULT" "$EMULATED_RESULT" "$CROSS_RESULT" "$FUZZ_RESULT" "$COMPATIBILITY_RESULT" "$REPOSITORY_RESULT" "$MOBILE_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done

  progress:
    name: Publish progress
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Render validated source progress
        run: |
          python3 tools/progress.py --write
          python3 tools/progress.py --check
      - name: Publish changed outputs and validate the generated commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRESS_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/publish_progress.sh
