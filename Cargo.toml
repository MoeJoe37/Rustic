[workspace]
members = ["crates/rustic-base", "crates/rustic-dom", "crates/rustic-url", "crates/rustic-html", "crates/rustic-engine", "crates/rustic-cli", "crates/rustic-fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/MoeJoe37/Rustic"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
