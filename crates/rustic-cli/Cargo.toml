[package]
name = "rustic-cli"
description = "Development command line entry point for Rustic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rustic"
path = "src/main.rs"

[dependencies]
rustic-base = { path = "../rustic-base" }
rustic-css = { path = "../rustic-css" }
rustic-dom = { path = "../rustic-dom" }
rustic-engine = { path = "../rustic-engine" }
rustic-html = { path = "../rustic-html" }
rustic-style = { path = "../rustic-style" }
rustic-url = { path = "../rustic-url" }

rustic-layout = { path = "../rustic-layout" }
rustic-text = { path = "../rustic-text" }
rustic-paint = { path = "../rustic-paint" }
rustic-raster = { path = "../rustic-raster" }
rustic-codecs = { path = "../rustic-codecs" }

[lints]
workspace = true
