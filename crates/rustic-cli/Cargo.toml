[package]
name = "rustic-cli"
description = "Development command line entry point for Rustic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "rustic_cli"
path = "src/lib.rs"

[[bin]]
name = "rustic"
path = "src/main.rs"

[dependencies]
rustic-a11y = { path = "../rustic-a11y" }
rustic-base = { path = "../rustic-base" }
rustic-css = { path = "../rustic-css" }
rustic-devtools = { path = "../rustic-devtools" }
rustic-dom = { path = "../rustic-dom" }
rustic-encoding = { path = "../rustic-encoding" }
rustic-engine = { path = "../rustic-engine" }
rustic-html = { path = "../rustic-html" }
rustic-gpu = { path = "../rustic-gpu" }
rustic-ipc = { path = "../rustic-ipc" }
rustic-sandbox = { path = "../rustic-sandbox" }
rustic-net = { path = "../rustic-net" }
rustic-storage = { path = "../rustic-storage" }
rustic-style = { path = "../rustic-style" }
rustic-url = { path = "../rustic-url" }

rustic-layout = { path = "../rustic-layout" }
rustic-native = { path = "../rustic-native" }
rustic-text = { path = "../rustic-text" }
rustic-paint = { path = "../rustic-paint" }
rustic-raster = { path = "../rustic-raster" }
# The desktop window stack (winit, AppKit on macOS). Off for the
# windowless `rustic-renderer` binary (TD-183, ADR 0074).
rustic-shell = { path = "../rustic-shell", optional = true }
rustic-codecs = { path = "../rustic-codecs" }
rustic-js = { path = "../rustic-js" }

[features]
default = ["window"]
# `rustic view`: the native window and browser shell.
window = ["dep:rustic-shell"]

[dev-dependencies]

[lints]
workspace = true
