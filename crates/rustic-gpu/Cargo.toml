[package]
name = "rustic-gpu"
description = "Rustic's hardware compositor inside the GPU process: Vulkan, Metal and Direct3D 12 through wgpu, with byte-exact parity to the CPU reference (ADR 0071)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustic-raster = { path = "../rustic-raster" }
wgpu = { version = "=26.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }

[lints]
workspace = true
