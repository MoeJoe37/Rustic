[package]
name = "rustic-net"
description = "Rustic's own HTTP/1.1 transport with an origin allowlist, timeouts, cancellation, backpressure and a loopback fixture server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustic-base = { path = "../rustic-base" }
rustic-encoding = { path = "../rustic-encoding" }
rustic-url = { path = "../rustic-url" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }

[lints]
workspace = true
