[package]
name = "rustic-net"
description = "Rustic's own HTTP/1.1 transport with an origin allowlist, timeouts, cancellation, backpressure and a loopback fixture server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustic-base = { path = "../rustic-base" }
rustic-codecs = { path = "../rustic-codecs" }
brotli-decompressor = { version = "=6.3.1", default-features = false }
rustic-encoding = { path = "../rustic-encoding" }
rustic-url = { path = "../rustic-url" }
ring = { version = "=0.17.14", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }

[lints]
workspace = true
