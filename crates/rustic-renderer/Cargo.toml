[package]
name = "rustic-renderer"
description = "Rustic's windowless child executable: the renderer and network processes without the desktop window stack (TD-183, ADR 0074)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rustic-renderer"
path = "src/main.rs"

[dependencies]
# Without the `window` feature: no winit, no AppKit, so on macOS no
# window-system initializers run before the process confines itself.
rustic-cli = { path = "../rustic-cli", default-features = false }

[lints]
workspace = true
