[package]
name = "rustic-shell"
description = "Rustic's desktop host: a native window, its event loop and CPU surface presentation (winit and softbuffer, ADR 0065)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustic-raster = { path = "../rustic-raster" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[lints]
workspace = true
