[package]
name = "rustic-text"
description = "Font selection, Unicode text algorithms and bounded OpenType adapters for Rustic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
harfrust = { version = "=0.15.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.50.0", default-features = false, features = ["std"] }
wuff = { version = "=0.2.10", default-features = false, features = ["brotli"] }
rustic-base = { path = "../rustic-base" }
rustic-codecs = { path = "../rustic-codecs" }

[lints]
workspace = true
