[advisories]
yanked = "deny"

[licenses]
# ISC: ring, rustls-webpki, untrusted. CDLA-Permissive-2.0: the Android
# fallback root data in webpki-root-certs (ADR 0051).
# BSD-2-Clause: arrayref, under tiny-skia, which sctk-adwaita uses to draw
# Wayland window decorations (ADR 0065); permissive and AGPL-compatible.
# CC0-1.0: hexf-parse, under naga, the shader translator of the GPU
# compositor (ADR 0071); a public-domain dedication.
allow = ["AGPL-3.0-only", "CC0-1.0", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "CDLA-Permissive-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Second versions only on targets other than Linux (ADR 0051): ring pins
# windows-sys 0.52 on Windows, and the Android JNI macros still use syn 2.
skip = [
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 on Windows; rustls-platform-verifier uses 0.61" },
    { crate = "syn@2.0.119", reason = "jni-macros and jni-sys-macros (Android only) have not moved to syn 3; thiserror 1 under calloop (winit) too" },
    # The desktop host's graph (winit 0.30, softbuffer 0.4; ADR 0065). These
    # are older majors its own dependencies still pin; none is reachable
    # from the engine crates.
    { crate = "rustix@0.38.44", reason = "calloop 0.13 (winit's Wayland event loop) on Linux; x11rb uses rustix 1" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 under calloop (winit) on Linux" },
    { crate = "thiserror@1.0.69", reason = "calloop 0.13 (winit) on Linux" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 under calloop (winit)" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17 (TLS, ADR 0051); winit's ahash uses getrandom 0.3" },
    { crate = "getrandom@0.3.4", reason = "ahash 0.8 under winit's Wayland backend" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 on UEFI targets only" },
    { crate = "bitflags@1.3.2", reason = "core-graphics 0.23 under winit, macOS only" },
    { crate = "core-foundation@0.9.4", reason = "core-graphics 0.23 under winit, macOS only" },
    { crate = "objc2@0.5.3", reason = "winit 0.30's AppKit bindings (objc2-foundation 0.2), macOS/iOS only; softbuffer uses objc2 0.6" },
    { crate = "objc2-foundation@0.2.2", reason = "winit 0.30, macOS/iOS only" },
    { crate = "jni-sys@0.3.1", reason = "ndk 0.9 under winit's android-activity, Android only" },
    { crate = "redox_syscall@0.4.1", reason = "winit on Redox only" },
    { crate = "redox_syscall@0.5.18", reason = "softbuffer on Redox only" },
    # The GPU compositor's graph (wgpu 26; ADR 0071), held at 26 by the
    # workspace MSRV.
    { crate = "hashbrown@0.15.5", reason = "naga, wgpu-core and gpu-descriptor (wgpu 26); the engine uses hashbrown 0.17" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15 under wgpu 26" },
    { crate = "core-graphics-types@0.1.3", reason = "core-graphics 0.23 under winit, macOS only; metal 0.32 (wgpu) uses 0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
